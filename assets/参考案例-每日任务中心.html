    else mid = '<span class="p">+10</span>';
    html += '<div class="' + cls + '" data-d="' + d + '" onclick="cellClick(' + d + ')">'
          + '<span class="n">' + d + '</span>' + mid + '</div>';
  }
  document.getElementById('cal').innerHTML = html;
}

function cellClick(d) {
  if (d > 9) { toast('暂不支持提前签到'); return; }
  var el = document.querySelector('.cell[data-d="' + d + '"]');
  if (el.classList.contains('signed')) { return; }
  if (d === 9) { doSign(); return; }
  openMakeup(d);
}

function doSign() {
  if (signedToday) { toast('今日已签到，请明日再来'); return; }
  signedToday = true;
  point += 10;
  document.getElementById('pointNum').innerText = point;
  var el = document.querySelector('.cell[data-d="9"]');
  el.classList.remove('today');
  el.classList.add('signed');
  el.innerHTML = '<span class="n">9</span><span class="p">+10</span>';
  var btn = document.getElementById('signBtn');
  btn.className = 'sign-btn grey';
  btn.innerText = '明日再来';
  openSign();
}

function openSign() {
  document.getElementById('modal').innerHTML =
    '<div class="modal-title">恭喜获得签到奖励</div>' +
    '<div class="modal-icon">+10</div>' +
    '<div class="modal-sub">积分 × 10</div>' +
    '<div class="modal-desc">积分可在兑换商店换取好礼</div>' +
    '<div class="modal-btns">' +
      '<button class="mbtn plain" data-act="close">开心收下</button>' +
      '<button class="mbtn primary" data-act="shop">去兑换</button>' +
    '</div>';
  showMask();
}

function openMakeup(d) {
  var cnt = 1;
  var cost = cnt === 1 ? 10 : (cnt === 2 ? 20 : 30);
  document.getElementById('modal').innerHTML =
    '<div class="modal-title">补签</div>' +
    '<div class="modal-sub">9 月 ' + d + ' 日</div>' +
    '<div class="modal-desc">本次补签消耗 ' + cost + ' 钻</div>' +
    '<div class="modal-btns">' +
      '<button class="mbtn plain" data-act="close">取消</button>' +
      '<button class="mbtn primary" data-act="makeup" data-day="' + d + '">确认补签</button>' +
    '</div>';
  showMask();
}

function openConfirm(id) {
  var g = null;
  for (var i = 0; i < goods.length; i++) { if (goods[i].id === id) g = goods[i]; }
  if (!g) return;
  if (g.sold) { toast('该商品已被抢完'); return; }
  if (point < g.price) { toast('积分不足'); return; }
  document.getElementById('modal').innerHTML =
    '<div class="modal-title">兑换确认</div>' +
    '<div class="modal-sub">' + g.name + '</div>' +
    '<div class="modal-desc">确定使用 ' + g.price + ' 积分兑换 ' + g.name + '？</div>' +
    '<div class="modal-btns">' +
      '<button class="mbtn plain" data-act="close">取消</button>' +
      '<button class="mbtn primary" data-act="exchange" data-id="' + id + '">确认兑换</button>' +
    '</div>';
  showMask();
}

function doRefresh() {
  if (point < 1) { toast('积分不足'); return; }
  point -= 1;
  document.getElementById('pointNum').innerText = point;
  toast('已消耗 1 积分刷新列表');
}

function showRule() {
  document.getElementById('modal').innerHTML =
    '<div class="modal-title">活动规则</div>' +
    '<div class="modal-desc" style="text-align:left;margin-top:10px">' +
    '1. 每日签到获得 10 积分，签到日历跟随自然月展示。<br>' +
    '2. 补签消耗按次序递增：第 1 次 10 钻、第 2 次 20 钻、第 3 次 30 钻，每月最多补签 3 次。<br>' +
    '3. 每日任务每日 0:00 重置，每日最多获得 11 积分。<br>' +
    '4. 每周点亮礼物，送出或收到指定礼物即可点亮，奖励可为积分或装扮，每周一 0:00 重置。<br>' +
    '5. 积分于每月最后一日 23:59:59 清零，请及时兑换。' +
    '</div>' +
    '<div class="modal-btns"><button class="mbtn primary" data-act="close">我知道了</button></div>';
  showMask();
}

function maskClick(e) {
  var t = e.target;
  var act = t.getAttribute && t.getAttribute('data-act');
  if (act === 'close') { hideMask(); return; }
  if (act === 'shop') { hideMask(); switchTab('shop'); return; }
  if (act === 'makeup') {
    hideMask();
    point += 10;
    document.getElementById('pointNum').innerText = point;
    toast('补签成功，获得 10 积分');
    return;
  }
  if (act === 'exchange') {
    var id = parseInt(t.getAttribute('data-id'), 10);
    for (var i = 0; i < goods.length; i++) {
      if (goods[i].id === id) {
        point -= goods[i].price;
        goods[i].sold = goods[i].limited ? goods[i].sold : true;
      }
    }
    hideMask();
    document.getElementById('pointNum').innerText = point;
    renderShop();
    toast('兑换成功，奖励已放入背包');
    return;
  }
  if (t.id === 'mask') hideMask();
}

function showMask() { document.getElementById('mask').classList.add('show'); }
function hideMask() { document.getElementById('mask').classList.remove('show'); }

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.innerText = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
}

function switchTab(p) {
  var ps = ['sign', 'task', 'light', 'shop'];
  for (var i = 0; i < ps.length; i++) {
    document.getElementById('pane-' + ps[i]).classList.toggle('active', ps[i] === p);
  }
  var tabs = document.querySelectorAll('.tab');
  for (var j = 0; j < tabs.length; j++) {
    tabs[j].classList.toggle('active', tabs[j].getAttribute('data-p') === p);
  }
}

function renderTasks() {
  var html = '';
  var got = 0;
  for (var i = 0; i < tasks.length; i++) {
    var t = tasks[i];
    var ok = t.cur >= t.max;
    if (ok) got += t.pt;
    var pct = Math.min(100, Math.round(t.cur / t.max * 100));
    var prog = ok ? '已完成' : t.cur + ' / ' + t.max + ' ' + t.unit;
    html += '<div class="task">' +
      '<div class="task-info">' +
        '<div class="task-name">' + t.name + '<span class="tag-type">' + t.type + '类</span></div>' +
        '<div class="task-prog">进度 ' + prog + '</div>' +
        '<div class="bar"><div class="bar-in' + (ok ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div class="task-pt">+' + t.pt + '</div>' +
      '<button class="task-btn' + (ok ? ' done' : '') + '" onclick="toast(\'跳转对应功能页\')">' + (ok ? '已领取' : '去完成') + '</button>' +
    '</div>';
  }
  document.getElementById('taskList').innerHTML = html;
  document.getElementById('taskTop').innerText =
    '每日 0:00 重置进度 · 今日已获 ' + got + ' / 11 积分';
}

function renderGifts() {
  var html = '';
  var allOn = true;
  for (var i = 0; i < gifts.length; i++) {
    var g = gifts[i];
    if (!g.on) allOn = false;
    html += '<div class="gift ' + (g.on ? 'on' : 'off') + '">' +
      '<div class="gift-icon" style="background:' + g.color + '">' + g.name.charAt(0) + '</div>' +
      '<div class="gift-name">' + g.name + '</div>' +
      '<div class="gift-rew">' + g.rew + '</div>' +
      '<div class="gift-state">' + (g.on ? '已点亮 · 奖励已到账' : '送出或收到即可点亮') + '</div>' +
    '</div>';
  }
  document.getElementById('lightGrid').innerHTML = html;
  if (allOn) document.getElementById('allon').style.display = 'block';
}

function renderShop() {
  var html = '';
  for (var i = 0; i < goods.length; i++) {
    var g = goods[i];
    var btnCls = 'goods-btn';
    var btnTxt = '兑换';
    if (g.sold) { btnCls += ' grey'; btnTxt = '已售罄'; }
    else if (point < g.price) { btnCls += ' grey'; btnTxt = '积分不足'; }
    html += '<div class="goods">' +
      '<div class="goods-icon" style="background:' + g.icon + '">' + g.name.charAt(0) + '</div>' +
      '<div class="goods-name">' + g.name + '</div>' +
      '<div class="goods-price">' + g.price + ' 积分</div>' +
      '<div class="goods-stock">' + g.stock + '</div>' +
      '<button class="' + btnCls + '" onclick="openConfirm(' + g.id + ')">' + btnTxt + '</button>' +
    '</div>';
  }
  document.getElementById('shopGrid').innerHTML = html;
  var rb = document.getElementById('refreshBtn');
  if (point < 1) { rb.className = 'refresh-btn grey'; }
}

document.addEventListener('DOMContentLoaded', function () {
  initCal();
  renderTasks();
  renderGifts();
  renderShop();
});
</script>
</body>
</html>
